<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<!-- viewport-fit=cover is required for env(safe-area-inset-*) to resolve on iOS;
     without it the fixed bottom tab bar sits in the home-indicator gesture strip. -->
<!-- Content-Security-Policy.
     script-src is 'self' with NO external origin at all. Every byte of script
     this page can run is in this repository: js/app.js as a module, plus the
     Leaflet build vendored under assets/vendor/leaflet/. There is no inline
     script, so an injected <script> cannot execute even if markup escaping were
     ever bypassed, and there is no CDN left whose compromise could substitute
     hostile JS. That is why the old integrity/crossorigin attributes are gone:
     SRI existed to pin bytes we did not control, and now we control them.
     style-src still needs 'unsafe-inline' because the views set style="" on 127
     elements; style injection is far lower severity than script injection.
     font-src is 'self': the two families are vendored under assets/fonts/.
     img-src needs data: for the CSS mask-image icons and the inline noise
     texture, and the two OSM hosts for map tiles, which are the only remaining
     third-party requests this app makes. -->
<meta http-equiv="Content-Security-Policy" content="
  default-src 'self';
  script-src 'self';
  style-src 'self' 'unsafe-inline';
  font-src 'self';
  img-src 'self' data: https://tile.openstreetmap.org https://*.tile.openstreetmap.org;
  connect-src 'self';
  object-src 'none';
  base-uri 'none';
  form-action 'none'">
<!-- frame-ancestors cannot be set from a <meta> tag; add this response header at
     deploy time to stop the app being framed:
       Content-Security-Policy: frame-ancestors 'none'
       X-Frame-Options: DENY -->
<!-- Do not leak the page we came from to the German authority sites we link out to. -->
<meta name="referrer" content="no-referrer">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#14161f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Führerschein">
<title>Führerschein Hero · Berlin</title>
<meta name="description" content="Gamified English-language guide to getting your German class B driving licence in Berlin.">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<!-- Cinzel (inscriptional display face) and DM Sans (the workhorse) are vendored
     under assets/fonts/ and declared in css/base.css. They used to come from
     fonts.googleapis.com, which sent every visitor's IP address to Google before
     a glyph was drawn. Both still degrade to a local stack if a file is missing. -->
<link rel="stylesheet" href="assets/vendor/leaflet/leaflet.css">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/components.css">
<!-- Leaflet 1.9.4, vendored from the npm tarball and byte-verified against the
     sha384 hashes this file used to pin. See docs/assets-provenance.md. -->
<script src="assets/vendor/leaflet/leaflet.js" defer></script>
</head>
<body>
<div class="flag-stripe" aria-hidden="true"></div>
<header class="app-header">
  <a class="brand" href="#/journey">
    <span class="brand-emoji" id="brand-mark"></span>
    <span class="brand-text"><strong>Führerschein Hero</strong><small>Berlin · Klasse B</small></span>
  </a>
  <div class="header-stats" id="header-stats"></div>
</header>
<nav class="tabs" id="tabs" aria-label="Main navigation">
  <a href="#/journey" data-route="journey"><span class="tab-ico" data-icon="route"></span><em>Journey</em></a>
  <a href="#/learn" data-route="learn"><span class="tab-ico" data-icon="book-open"></span><em>Learn</em></a>
  <a href="#/exam" data-route="exam"><span class="tab-ico" data-icon="clipboard-check"></span><em>Exam</em></a>
  <a href="#/map" data-route="map"><span class="tab-ico" data-icon="map-pin"></span><em>Places</em></a>
  <a href="#/stats" data-route="stats"><span class="tab-ico" data-icon="trophy"></span><em>Progress</em></a>
  <a href="#/glossary" data-route="glossary"><span class="tab-ico" data-icon="languages"></span><em>Glossary</em></a>
</nav>
<main id="view" class="view" tabindex="-1"></main>
<div id="modal-root"></div>
<div id="toast-root" aria-live="polite"></div>
<canvas id="confetti" aria-hidden="true"></canvas>
<script type="module" src="js/app.js"></script>
</body>
</html>
