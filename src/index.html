<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<!-- viewport-fit=cover is required for env(safe-area-inset-*) to resolve on iOS;
     without it the fixed bottom tab bar sits in the home-indicator gesture strip. -->
<!-- Content-Security-Policy.
     script-src IS NO LONGER 'self' ALONE. It now also allows
     https://www.googletagmanager.com, and this comment says so plainly because
     it used to boast the opposite. Everything else the page can execute is still
     in this repository: js/app.js as a module, plus the Leaflet build vendored
     under assets/vendor/leaflet/. There is still no inline script, so an
     injected <script> cannot execute even if markup escaping were ever bypassed.
     What that one external origin costs is worth stating exactly. A script
     served from someone else's CDN cannot be pinned with Subresource Integrity,
     because Google reissues gtag.js whenever it likes and any hash we wrote here
     would break the site on their next change. So we run whatever bytes that URL
     returns at the moment it is fetched. That is a deliberate tradeoff for
     analytics, accepted with two things narrowing it: NOTHING is requested from
     any Google host until a visitor clicks accept in the banner js/consent.js
     mounts, so a visitor who declines or never answers runs first-party code
     only, and the app holds no accounts, credentials or cookies of its own for
     that script to reach.
     connect-src carries the GA4 collection endpoints, which is where gtag sends
     its hits, and the wildcard covers the regional variants
     (region1.google-analytics.com and friends).
     img-src carries www.google-analytics.com as well, because gtag falls back to
     a pixel when fetch and sendBeacon are both unavailable.
     style-src still needs 'unsafe-inline' because the views set style="" on 127
     elements; style injection is far lower severity than script injection.
     font-src is 'self': the two families are vendored under assets/fonts/.
     img-src needs data: for the CSS mask-image icons and the inline noise
     texture, and the two OSM hosts for map tiles. -->
<meta http-equiv="Content-Security-Policy" content="
  default-src 'self';
  script-src 'self' https://www.googletagmanager.com;
  style-src 'self' 'unsafe-inline';
  font-src 'self';
  img-src 'self' data: https://tile.openstreetmap.org https://*.tile.openstreetmap.org https://www.google-analytics.com;
  connect-src 'self' https://www.google-analytics.com https://analytics.google.com https://*.google-analytics.com;
  object-src 'none';
  base-uri 'none';
  form-action 'none'">
<!-- Clickjacking: NOT mitigated on the current deployment, deliberately and
     knowingly. frame-ancestors cannot be set from a <meta> tag, and v1 is hosted
     on GitHub Pages, which cannot send custom response headers at all. So the
     deployed site IS framable. Severity is low here because the app is
     read-only, has no accounts, no credentials, no cookies and no state-changing
     request an attacker could trigger from inside a frame. Do not read the lines
     below as something already in force. They are the headers to switch on the
     day this site sits behind something that can actually set them, most likely
     a CDN or reverse proxy in front of Pages (Cloudflare, Fastly, nginx). That
     is a hosting change, not an application change: nothing in this repository
     has to move for these to start working, so re-enable all three as soon as
     there is a layer that can send them.
       Content-Security-Policy: frame-ancestors 'none'
       X-Frame-Options: DENY
       X-Content-Type-Options: nosniff
     Tracked in SECURITY.md under the hosting limitation. -->
<!-- Do not leak the page we came from to the German authority sites we link out to. -->
<meta name="referrer" content="no-referrer">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#14161f">
<!-- Both spellings are required, and neither is redundant. Chrome deprecated the
     apple-prefixed one and warns about it in the console, but iOS Safari still
     reads ONLY that one to decide whether an installed shortcut opens without
     browser chrome. Dropping it to silence the warning would quietly break
     standalone mode on iPhone, which is the platform the safe-area handling in
     this file exists for. So: the standard name for Chrome, the vendor name for
     Safari, and the warning goes away. -->
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Führerschein">
<title>Führerschein Hero · Berlin</title>
<meta name="description" content="Gamified English-language guide to getting your German class B driving licence in Berlin.">
<!-- GA4 measurement ID. The app has no build step, so the Pages workflow
     substitutes the real value here at deploy time from a repository variable.
     The placeholder that lives in the repository means analytics is OFF: anything
     that is not shaped like a G-xxxx id is read as "not configured" by
     js/consent.js, so local development, a fork and a plain file:// open never
     talk to Google and never show a banner. -->
<meta name="ga-measurement-id" content="__GA_MEASUREMENT_ID__">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<!-- Cinzel (inscriptional display face) and DM Sans (the workhorse) are vendored
     under assets/fonts/ and declared in css/base.css. They used to come from
     fonts.googleapis.com, which sent every visitor's IP address to Google before
     a glyph was drawn. Both still degrade to a local stack if a file is missing. -->
<link rel="stylesheet" href="assets/vendor/leaflet/leaflet.css">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/components.css">
<!-- Leaflet 1.9.4, vendored from the npm tarball and byte-verified against the
     sha384 hashes this file used to pin before the CDN was removed. Licence:
     assets/vendor/leaflet/LICENSE.leaflet. See SECURITY.md for the reasoning. -->
<script src="assets/vendor/leaflet/leaflet.js" defer></script>
</head>

<header class="app-header">
  <a class="brand" href="#/journey">

  </a>
  <div class="header-stats" id="header-stats"></div>
</header>
<nav class="tabs" id="tabs" aria-label="Main navigation">

</html>
