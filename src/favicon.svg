<!-- Tab icon. Geometry is kept in step with emblem() in js/brand.js on purpose:
     the favicon and the in-app mark must read as the same object. Built to
     survive 16px. A circle above the road taper was tried first and read as a
     head, turning the mark into a pedestrian warning sign, so the horizon is a
     bar instead. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <linearGradient id="fav-plate" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2b3247"/>
      <stop offset="1" stop-color="#171b28"/>
    </linearGradient>
    <linearGradient id="fav-gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f5d98a"/>
      <stop offset="1" stop-color="#b8831c"/>
    </linearGradient>
  </defs>
  <rect x="1.6" y="1.6" width="28.8" height="28.8" rx="4"
    fill="url(#fav-plate)" stroke="url(#fav-gold)" stroke-width="2.2"/>
  <!-- the road, in gold: wide at the driver, narrowing toward the horizon -->
  <path d="M6.8 25.8 L12.9 12.6 h6.2 L25.2 25.8 Z" fill="url(#fav-gold)"/>
  <!-- one dark centre dash: the only interior detail that survives small -->
  <path d="M14.85 24.2 h2.3 l-.75 -7.2 h-.8 Z" fill="#141821"/>
  <!-- horizon -->
  <rect x="9.2" y="8.6" width="13.6" height="2.4" rx="1.2" fill="#f5d98a"/>
</svg>
