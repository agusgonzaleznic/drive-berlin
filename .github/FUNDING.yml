# Funding sources shown in the "Sponsor" button on the repository page.
#
# NOTE ON THE github LINE BELOW:
#   The GitHub Sponsors entry only renders once GitHub Sponsors has actually been
#   enabled and approved on the account. Until then GitHub silently ignores it, so
#   the Sponsor button will show only the custom link. Enable Sponsors at
#   https://github.com/sponsors and the entry starts working with no change here.
#
# TO ADD A COFFEE LINK LATER:
#   Uncomment the relevant line and fill in the username. Both keys take a bare
#   username, not a full URL.
#     ko_fi: <username>          → https://ko-fi.com/<username>
#     buy_me_a_coffee: <username> → https://buymeacoffee.com/<username>
#
# Docs: https://docs.github.com/repositories/managing-your-repositorys-settings-and-features/customizing-your-repository/displaying-a-sponsor-button-in-your-repository

github: [agusgonzaleznic]

custom: ["https://agusgonzaleznic.com"]

