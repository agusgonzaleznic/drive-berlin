# Verifies every pull request and every push to main.
#
# Actions are pinned to full 40-character commit SHAs for the same reason as in
# pages.yml: a tag is a mutable ref that can be repointed at different code after
# it was reviewed, whereas a commit SHA is immutable. The trailing comment
# records the release the SHA was resolved from. Re-resolve the SHA from the API
# when bumping, and update the comment alongside it.
#
# The merge is the release. On a pull request, "Release / Check the version"
# says which version the merge releases. On main, once the test suite passes,
# the Release job tags the next version when src/ (or release.yml) changed since
# the newest tag, and starts release.yml on the tag, which publishes the GitHub
# release. Nobody pushes a tag by hand. Both jobs run the shared
# version-tag.yml from agusgonzaleznic/github-reusable-workflows.
#
# Read-only token, except for the Release job on main, which tags the commit and
# starts the release.

name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# A pull request cancels its older runs: an interrupted test run leaves no
# partial state behind. Runs on main never cancel a running one, because it may
# be tagging a version and waiting for its release.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: Node test suite
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Nothing here needs to push, so do not persist the token into
          # .git/config where a later step could reach it.
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          # package.json declares no engines field. Node 24 is the current LTS
          # line and satisfies the one transitive floor in the lockfile
          # (playwright-core requires node >=20).
          node-version: '24'
          cache: npm

      # npm ci, not npm install. `ci` installs exactly the versions pinned in
      # package-lock.json and fails outright if the lockfile and package.json
      # disagree. `install` would silently resolve newer versions, which means CI
      # could end up executing dependency code nobody reviewed. For a public
      # repository taking outside contributions, that difference is the whole
      # point of having a lockfile.
      - name: Install dependencies
        run: npm ci

      # `npm test` runs `node --test tests/*.test.mjs`: the pure Node unit tests
      # covering the data files, deadline arithmetic, scoring, progress tracking
      # and the security helpers. No browser is involved, so these run fine on a
      # stock runner.
      #
      # THE BROWSER SUITES ARE DELIBERATELY NOT RUN HERE, AND THEY HAVE NOT RUN.
      # test:browser, test:course, test:a11y, test:contrast and test:csp all
      # launch SYSTEM Chrome through playwright-core at the hardcoded macOS path
      # /Applications/Google Chrome.app/Contents/MacOS/Google Chrome
      # (see tests/browser.mjs, tests/course.browser.mjs, tests/a11y.mjs,
      # tests/measure.mjs, tests/csp.mjs, tests/emojiscan.mjs). That path does
      # not exist on ubuntu-latest, so as written they cannot run here: they
      # would fail on launch, not report a real result. Running them in CI would
      # require either installing a browser and threading its path through, or
      # reworking the suites to resolve an executable from the environment.
      # Until then these are a LOCAL macOS gate, and a green CI run does not
      # cover them. Run `npm run test:all` on macOS before merging a change to
      # src/, since the merge is the release.
      - name: Run the Node test suite
        run: npm test

      # Checks the Markdown: every heading anchor, every relative file path, and
      # the no-em-dash rule on the prose files. This is a separate step from
      # `npm test` so that a broken link reports as its own red step rather than
      # hiding inside the unit test output.
      #
      # It is worth gating in CI because these break silently. A README anchor is
      # just a string: it renders as a normal link whether or not the heading it
      # points at exists, so nothing surfaces the rot until a reader clicks it.
      # Two anchors were already broken when this check was written. Deleting or
      # renaming a doc breaks inbound links the same quiet way.
      #
      # Pure Node, no browser, so unlike the suites described above this one does
      # run here and its result is real.
      - name: Check Markdown links and anchors
        run: npm run check:links

  # The version comes from the tags: the next minor version, or the next major
  # one when a merged pull request has the label "breaking". Only src/, the site
  # Pages serves, ships. release.yml is listed too, so a fix to it can ship.
  check-version:
    name: Release
    if: github.event_name == 'pull_request'
    uses: agusgonzaleznic/github-reusable-workflows/.github/workflows/version-tag.yml@1832ea3171529c36e663d34965917c9f14694ce5 # v1.9.0
    permissions:
      contents: read
    with:
      version-from-tags: true
      release-paths: |
        src/
        .github/workflows/release.yml

  # Tags the next version on the merge when what ships changed, then runs
  # release.yml on the tag and waits for it. A release that fails turns this run
  # red.
  release:
    name: Release
    if: github.event_name == 'push'
    needs: test
    uses: agusgonzaleznic/github-reusable-workflows/.github/workflows/version-tag.yml@1832ea3171529c36e663d34965917c9f14694ce5 # v1.9.0
    permissions:
      contents: write
      actions: write
      pull-requests: read
    with:
      version-from-tags: true
      release-paths: |
        src/
        .github/workflows/release.yml
