# Publishes the static site in src/ to GitHub Pages.
#
# WHY EVERY ACTION IS PINNED TO A FULL 40-CHARACTER COMMIT SHA
# Tags such as v4 are mutable git refs. Anyone who controls an action's
# repository, or anyone who steals a maintainer's credentials, can move a tag to
# point at different code. A workflow that trusts a tag therefore runs whatever
# that tag points at today, not the code that was reviewed when it was adopted.
# Because these jobs run with a GITHUB_TOKEN and can publish this site, a
# repointed tag would be arbitrary code execution inside our release path. A
# commit SHA is content-addressed and immutable, so pinning to one freezes the
# exact bytes that run. The trailing comment records the human-readable release
# the SHA was resolved from. When bumping, re-resolve the SHA from the API and
# update the comment with it: never hand-edit either half on its own.
#
# WHY PERMISSIONS START EMPTY
# The default GITHUB_TOKEN can be granted broad write access to the repository.
# This repository is public, so any action in the graph, including transitive
# ones we did not audit, inherits whatever the token holds. Top-level
# `permissions: {}` denies every scope, then each job re-grants only what it
# genuinely needs. If a step ever tries to reach beyond that, it fails loudly
# instead of succeeding quietly.

name: Deploy to Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Deny all by default. Scopes are granted per job below.
permissions: {}

# A Pages deployment replaces the whole live site, so two overlapping runs can
# interleave and leave a half-updated site published. Queue them rather than
# cancelling: cancel-in-progress would abandon a deploy partway through, which
# is the exact corruption this guards against.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Package src/
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Do not leave the token in .git/config for later steps to pick up.
          # Nothing here needs to push.
          persist-credentials: false

      - name: Configure Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      # The app has no build step, so the GA4 measurement ID is substituted into
      # the meta tag here rather than at build time. It is a repository VARIABLE,
      # not a secret: a G-xxxx id is public by design and ships in the client of
      # every site that uses GA. Leaving the variable unset is the supported way
      # to keep analytics off: consent.js validates the value against /^G-[A-Z0-9]{4,}$/
      # and does nothing at all when it is missing or still the placeholder, so no
      # banner appears and no Google host is contacted.
      #
      # The repository itself must always hold the placeholder. tests/security.test.mjs
      # asserts exactly that, so a real id can never be committed by accident.
      - name: Inject the GA measurement ID
        env:
          GA_ID: ${{ vars.GA_MEASUREMENT_ID }}
        run: |
          if [ -z "${GA_ID}" ]; then
            echo "GA_MEASUREMENT_ID is not set: analytics stays disabled, no banner will show."
            exit 0
          fi
          case "${GA_ID}" in
            G-*) ;;
            *) echo "::error::GA_MEASUREMENT_ID must look like G-XXXXXXXXXX, got a value that does not"; exit 1 ;;
          esac
          grep -q '__GA_MEASUREMENT_ID__' src/index.html \
            || { echo "::error::placeholder __GA_MEASUREMENT_ID__ not found in src/index.html"; exit 1; }
          sed -i "s/__GA_MEASUREMENT_ID__/${GA_ID}/" src/index.html
          echo "Injected measurement ID (analytics enabled, still gated behind consent)."

      # There is no build step. The app is plain HTML, CSS and ES modules, so
      # src/ is uploaded exactly as it sits in the repository.
      - name: Upload src/ as the Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: src

  deploy:
    name: Deploy to Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      contents: read
      # Create and publish the Pages deployment.
      pages: write
      # Mint the OIDC token that deploy-pages exchanges for its deploy
      # credential. Without this the deployment cannot authenticate.
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0

  # The canonical address is https://agusgonzaleznic.com/drive-berlin/, which is
  # this Pages site behind a CloudFront distribution defined in the
  # agusgonzaleznic.github.io repository. CloudFront caches the HTML with
  # max-age=600, so without this job a deploy takes up to ten minutes to become
  # visible on the canonical URL while the github.io URL updates at once. That gap
  # is genuinely confusing: it once looked exactly like a failed deploy.
  #
  # This job is deliberately allowed to fail without failing the workflow. Pages
  # has already published by the time it runs, so a CDN that refuses an
  # invalidation should leave a warning and a stale cache for ten minutes, not a red
  # deploy that suggests the site is broken when it is not.
  invalidate:
    name: Invalidate the CloudFront cache
    needs: deploy
    runs-on: ubuntu-latest
    # Nothing to invalidate when the variables are absent, which is the case for
    # every fork. Skipping keeps a fork's deploy green instead of failing on a role
    # it can neither see nor assume.
    if: vars.AWS_CDN_ROLE_ARN != '' && vars.CLOUDFRONT_DISTRIBUTION_ID != ''
    continue-on-error: true
    permissions:
      contents: read
      # Mint the OIDC token exchanged for the AWS role. No long-lived AWS key
      # exists in this repository, and none should.
      id-token: write
    steps:
      # The role trusts only this repository on refs/heads/main, and its policy
      # grants CreateInvalidation and GetInvalidation on that one distribution and
      # nothing else. Worst case if it were ever abused: somebody clears a cache.
      - name: Assume the CDN invalidation role
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          role-to-assume: ${{ vars.AWS_CDN_ROLE_ARN }}
          aws-region: us-east-1
          role-duration-seconds: 900

      # Only the app's own subtree is invalidated. A wildcard on /* would clear the
      # personal site's cache too, which this deploy has no business touching.
      - name: Invalidate /drive-berlin
        env:
          DIST: ${{ vars.CLOUDFRONT_DISTRIBUTION_ID }}
        run: |
          id=$(aws cloudfront create-invalidation \
                 --distribution-id "$DIST" \
                 --paths '/drive-berlin' '/drive-berlin/*' \
                 --query 'Invalidation.Id' --output text)
          echo "Invalidation $id created."
          aws cloudfront wait invalidation-completed --distribution-id "$DIST" --id "$id" \
            && echo "Invalidation $id completed." \
            || echo "::warning::Invalidation $id did not complete in time. Pages is already published; the CDN catches up within its 600s TTL."

